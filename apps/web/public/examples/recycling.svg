<svg xmlns="http://www.w3.org/2000/svg" width="820" height="690" viewBox="0 0 820 690"><title>Where does this waste go?</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#637568"/></marker></defs><rect width="820" height="690" fill="#fbfcfa"/><path id="e1" data-source="start" data-target="organic" data-label="" d="M410 90 C410 125 410 125 410 160" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><path id="e2" data-source="organic" data-target="compost" data-label="Yes" d="M300 205 C300 288.75 260 288.75 260 372.5" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="288.75" font-family="sans-serif" font-size="14" fill="#334b3b">Yes</text><path id="e3" data-source="organic" data-target="clean" data-label="No" d="M300 205 C300 292.5 640 292.5 640 380" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><text x="490" y="292.5" font-family="sans-serif" font-size="14" fill="#334b3b">No</text><path id="e4" data-source="clean" data-target="recycle" data-label="Yes" d="M400 380 C400 478.75 545 478.75 545 577.5" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><text x="492.5" y="478.75" font-family="sans-serif" font-size="14" fill="#334b3b">Yes</text><path id="e5" data-source="clean" data-target="landfill" data-label="No" d="M400 380 C400 478.75 780 478.75 780 577.5" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><text x="610" y="478.75" font-family="sans-serif" font-size="14" fill="#334b3b">No</text><rect id="start" data-node-id="start" data-node-type="start" x="320" y="30" width="180" height="60" rx="30" fill="#edf3e9" stroke="#95ad97"/><text x="410" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Identify the item</text><polygon id="organic" data-node-id="organic" data-node-type="decision" points="410,160 520,205 410,250 300,205" fill="#fcf0d4" stroke="#95ad97"/><text x="410" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Organic material?</text><polygon id="clean" data-node-id="clean" data-node-type="decision" points="520,335 640,380 520,425 400,380" fill="#fcf0d4" stroke="#95ad97"/><text x="520" y="385" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Clean and recyclable?</text><rect id="compost" data-node-id="compost" data-node-type="end" x="70" y="340" width="190" height="65" rx="30" fill="#d9edda" stroke="#95ad97"/><text x="165" y="377.5" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Compost</text><rect id="recycle" data-node-id="recycle" data-node-type="end" x="335" y="545" width="210" height="65" rx="30" fill="#d9edda" stroke="#95ad97"/><text x="440" y="582.5" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Recycling stream</text><rect id="landfill" data-node-id="landfill" data-node-type="end" x="600" y="545" width="180" height="65" rx="30" fill="#d9edda" stroke="#95ad97"/><text x="690" y="582.5" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">General waste</text></svg>