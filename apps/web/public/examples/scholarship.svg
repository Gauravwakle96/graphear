<svg xmlns="http://www.w3.org/2000/svg" width="820" height="740" viewBox="0 0 820 740"><title>Scholarship application</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#637568"/></marker></defs><rect width="820" height="740" fill="#fbfcfa"/><path id="begin" data-source="start" data-target="eligibility" data-label="" d="M410 93 C410 126.5 410 126.5 410 160" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><path id="enrolled-yes" data-source="eligibility" data-target="income" data-label="Yes" d="M410 248 C410 276.5 410 276.5 410 305" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="276.5" font-family="sans-serif" font-size="14" fill="#334b3b">Yes</text><path id="enrolled-no" data-source="eligibility" data-target="declined" data-label="No" d="M310 204 C310 284.5 225 284.5 225 365" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><text x="287.5" y="284.5" font-family="sans-serif" font-size="14" fill="#334b3b">No</text><path id="income-yes" data-source="income" data-target="documents" data-label="Yes" d="M410 393 C410 424 410 424 410 455" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="424" font-family="sans-serif" font-size="14" fill="#334b3b">Yes</text><path id="income-no" data-source="income" data-target="declined" data-label="No" d="M310 349 C310 357 225 357 225 365" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><text x="287.5" y="357" font-family="sans-serif" font-size="14" fill="#334b3b">No</text><path id="verify" data-source="documents" data-target="approved" data-label="Complete" d="M410 525 C410 565 410 565 410 605" fill="none" stroke="#637568" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="565" font-family="sans-serif" font-size="14" fill="#334b3b">Complete</text><rect id="start" data-node-id="start" data-node-type="start" x="320" y="35" width="180" height="58" rx="30" fill="#edf3e9" stroke="#95ad97"/><text x="410" y="69" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Start application</text><polygon id="eligibility" data-node-id="eligibility" data-node-type="decision" points="410,160 510,204 410,248 310,204" fill="#fcf0d4" stroke="#95ad97"/><text x="410" y="209" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Enrolled student?</text><polygon id="income" data-node-id="income" data-node-type="decision" points="410,305 510,349 410,393 310,349" fill="#fcf0d4" stroke="#95ad97"/><text x="410" y="354" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Income under ₹2.5 lakh?</text><rect id="documents" data-node-id="documents" data-node-type="process" x="310" y="455" width="200" height="70" rx="10" fill="#edf3e9" stroke="#95ad97"/><text x="410" y="495" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Verify documents</text><rect id="approved" data-node-id="approved" data-node-type="end" x="310" y="605" width="200" height="65" rx="30" fill="#d9edda" stroke="#95ad97"/><text x="410" y="642.5" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Application approved</text><rect id="declined" data-node-id="declined" data-node-type="end" x="55" y="330" width="170" height="70" rx="30" fill="#d9edda" stroke="#95ad97"/><text x="140" y="370" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#203b32">Not eligible</text></svg>