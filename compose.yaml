services:
  graphear:
    build: .
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}'
      APP_PUBLIC_URL: '${APP_PUBLIC_URL:-}'
      PROXY_TRUST_HOPS: '${PROXY_TRUST_HOPS:-0}'
      AI_PROVIDER: '${AI_PROVIDER:-openai}'
      AI_FREE_TIER: '${AI_FREE_TIER:-0}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      OPENAI_MODEL: '${OPENAI_MODEL:-gpt-6-astra}'
      OPENAI_TRANSCRIPTION_MODEL: '${OPENAI_TRANSCRIPTION_MODEL:-gpt-transcribe}'
      GEMINI_API_KEY: '${GEMINI_API_KEY:-}'
      GEMINI_MODEL: '${GEMINI_MODEL:-gemini-3.1-flash-lite}'
      GEMINI_THINKING_BUDGET: '${GEMINI_THINKING_BUDGET:-}'
      GEMINI_REPAIR_INVALID_JSON: '${GEMINI_REPAIR_INVALID_JSON:-0}'
      COMPATIBLE_BASE_URL: '${COMPATIBLE_BASE_URL:-http://127.0.0.1:31415/v1}'
      COMPATIBLE_NAME: '${COMPATIBLE_NAME:-AI gateway}'
      COMPATIBLE_API_KEY: '${COMPATIBLE_API_KEY:-}'
      COMPATIBLE_API: '${COMPATIBLE_API:-responses}'
      COMPATIBLE_MODEL: '${COMPATIBLE_MODEL:-}'
      COMPATIBLE_VISION_MODEL: '${COMPATIBLE_VISION_MODEL:-}'
      COMPATIBLE_MAX_OUTPUT_TOKENS: '${COMPATIBLE_MAX_OUTPUT_TOKENS:-4096}'
      COMPATIBLE_STRUCTURED_OUTPUT: '${COMPATIBLE_STRUCTURED_OUTPUT:-json_schema}'
      COMPATIBLE_REPAIR_INVALID_JSON: '${COMPATIBLE_REPAIR_INVALID_JSON:-0}'
      COMPATIBLE_TRANSCRIPTION_MODEL: '${COMPATIBLE_TRANSCRIPTION_MODEL:-}'
      AI_TIMEOUT_SECONDS: '${AI_TIMEOUT_SECONDS:-120}'
      AI_DAILY_CALL_LIMIT: '${AI_DAILY_CALL_LIMIT:-50}'
      AI_JOB_CALL_LIMIT: '${AI_JOB_CALL_LIMIT:-12}'
      LEARNING_UPLOAD_MB: '${LEARNING_UPLOAD_MB:-100}'
      LEARNING_MEDIA_MINUTES: '${LEARNING_MEDIA_MINUTES:-30}'
      LEARNING_RETENTION_HOURS: '${LEARNING_RETENTION_HOURS:-168}'
      LEARNING_UPLOAD_DIR: '/app/data/learning'
      YOUTUBE_API_KEY: '${YOUTUBE_API_KEY:-}'
      YOUTUBE_OAUTH_TOKEN: '${YOUTUBE_OAUTH_TOKEN:-}'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - graphear-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  graphear-data:
